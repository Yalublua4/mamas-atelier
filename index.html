<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог швейной фурнитуры | Ателье</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --wa-green: #25d366;
      --wa-hover: #1ebd5b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --danger-text: #b91c1c;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #047857;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* Шапка сайта */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      height: 48px;
      max-width: 160px;
      object-fit: contain;
      border-radius: 8px;
      display: none;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Кнопка "Как нас найти" */
    .find-us-btn {
      color: var(--primary);
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 9px 16px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .find-us-btn:hover {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* Кнопка WhatsApp в шапке */
    .header-wa-btn {
      background-color: var(--wa-green);
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
    }

    .header-wa-btn:hover {
      background-color: var(--wa-hover);
      transform: translateY(-1px);
    }

    /* Главный контейнер */
    .container {
      max-width: 1200px;
      margin: 30px auto 0;
      padding: 0 20px;
    }

    /* Блок поиска и фильтрации */
    .toolbar {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 45px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fdfdfd;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: #ffffff;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .pills-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .pill-btn.active, .pill-btn:hover {
      background: var(--text);
      color: #ffffff;
      border-color: var(--text);
    }

    .items-count {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Сетка товаров */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    /* Карточка товара */
    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.08);
    }

    /* Товар не в продаже (N) */
    .product-card.unavailable {
      opacity: 0.65;
      border-color: var(--danger-border);
      background: var(--danger-bg);
    }

    .product-card.unavailable:hover {
      opacity: 0.9;
    }

    .card-img-wrap {
      width: 100%;
      padding-top: 100%;
      position: relative;
      background: #e2e8f0;
      overflow: hidden;
      cursor: zoom-in;
    }

    .card-img-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .card-img-wrap img {
      transform: scale(1.05);
    }

    /* Подсказка при наведении на картинку */
    .card-img-wrap::after {
      content: '🔍 Нажмите для просмотра';
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.75);
      color: #ffffff;
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .card-img-wrap:hover::after {
      opacity: 1;
    }

    /* Бейдж статуса */
    .status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 2;
    }

    .status-available {
      background: rgba(236, 253, 245, 0.92);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .status-unavailable {
      background: rgba(254, 242, 242, 0.95);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 12px;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      text-transform: capitalize;
    }

    .price-block {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .price-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
    }

    .price-unit {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Кнопка заказа в WhatsApp для конкретного товара */
    .order-btn {
      width: 100%;
      background: #f1f5f9;
      color: var(--text);
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .order-btn:hover {
      background: var(--wa-green);
      color: #ffffff;
    }

    .product-card.unavailable .order-btn {
      background: #ffffff;
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

    /* Модальное окно "Как нас найти" */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 550px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      position: relative;
      animation: scaleUp 0.25s ease;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .close-btn:hover {
      background: #e2e8f0;
      color: var(--text);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .address-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .address-card svg {
      color: var(--primary);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .address-text {
      font-size: 1rem;
      font-weight: 600;
      color: #1e3a8a;
    }

    .orientir-img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: none;
      cursor: zoom-in;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .modal-wa-btn {
      width: 100%;
      background: var(--wa-green);
      color: #ffffff;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .modal-wa-btn:hover {
      background: var(--wa-hover);
    }

    /* Плавающая кнопка WhatsApp в правом нижнем углу */
    .floating-wa {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--wa-green);
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
      z-index: 99;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .floating-wa:hover {
      transform: scale(1.08);
      box-shadow: 0 14px 30px rgba(37, 211, 102, 0.5);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      color: var(--text-muted);
    }

    .empty-state h4 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: var(--text);
    }

    /* ========================================================
       ПРОСМОТРЩИК ФОТО (LIGHTBOX): ЗУМ + ПЕРЕМЕЩЕНИЕ + СКАЧИВАНИЕ
       ======================================================== */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 29, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 2000;
      padding: 20px;
      user-select: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox-modal.active {
      display: flex;
      opacity: 1;
    }

    /* Верхняя панель управления просмотрщиком */
    .lightbox-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      z-index: 2010;
      color: #ffffff;
    }

    .lightbox-title {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50%;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .lightbox-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lb-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      min-width: 42px;
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .lb-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .lb-btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .lb-btn-primary:hover {
      background: var(--primary-hover);
    }

    .lb-btn-close {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .lb-btn-close:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
    }

    /* Контейнер для фото */
    .lightbox-viewport {
      width: 100%;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .lightbox-viewport.grabbing {
      cursor: grabbing;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      pointer-events: auto;
    }

    /* Подсказка внизу */
    .lightbox-hint {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      text-align: center;
      z-index: 2010;
      padding-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 640px) {
      .header-container {
        padding: 10px 16px;
      }
      .catalog-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .card-body {
        padding: 12px;
      }
      .product-title {
        font-size: 0.95rem;
      }
      .price-value {
        font-size: 1.15rem;
      }
      .lightbox-title {
        display: none;
      }
      .lb-btn span {
        display: none;
      }
      .lb-btn {
        padding: 0 10px;
        min-width: 38px;
        height: 38px;
      }
      .lightbox-modal {
        padding: 12px;
      }
      .lightbox-img {
        max-width: 96vw;
        max-height: 80vh;
      }
    }
  </style>
</head>
<body>

  <!-- Шапка сайта -->
  <header>
    <div class="header-container">
      <a href="#" class="brand">
        <!-- Картинка LOGO отобразится тут, если загружена -->
        <img id="logo-img" class="brand-logo" alt="Логотип">
        <span id="brand-fallback-text" class="brand-title">Ателье & Фурнитура</span>
      </a>

      <div class="header-actions">
        <!-- Кнопка "Как нас найти" -->
        <button id="open-orientir-btn" class="find-us-btn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Как нас найти?
        </button>

        <!-- Прямая ссылка на WhatsApp -->
        <a href="https://wa.me/77058202949" target="_blank" class="header-wa-btn">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">

          </svg>
          +7 705 820 2949
        </a>
      </div>
    </div>
  </header>

  <!-- Каталог и поиск -->
  <main class="container">
    <section class="toolbar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию (например: Пуговицы, Нитки, Замок)...">
      </div>
      <div class="filter-pills">
        <div class="pills-group">
          <button class="pill-btn active" data-filter="all">Все товары</button>
          <button class="pill-btn" data-filter="available">Доступно к продаже</button>
          <button class="pill-btn" data-filter="unavailable">Нет в продаже</button>
        </div>
        <div id="counter" class="items-count">Загрузка каталога...</div>
      </div>
    </section>

    <!-- Сетка с карточками товаров -->
    <section id="catalog-grid" class="catalog-grid"></section>
  </main>

  <!-- Модальное окно "Как нас найти?" -->
  <div id="orientir-modal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Как нас найти</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="address-card">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <div>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2px;">Адрес ателье:</div>
            <div class="address-text">Астана 34, рынок (напротив здания Амангельды)</div>
          </div>
        </div>
        <!-- Фото ORIENTIR кликабельно для зума -->
        <img id="orientir-photo" class="orientir-img" alt="Ориентир ателье" title="Нажмите для приближения">
      </div>
      <div class="modal-footer">
        <a href="https://wa.me/77058202949" target="_blank" class="modal-wa-btn">
          Написать в WhatsApp (+7 705 820 2949)
        </a>
      </div>
    </div>
  </div>

  <!-- Плавающая иконка WhatsApp -->
  <a href="https://wa.me/77058202949" target="_blank" class="floating-wa" title="Написать в WhatsApp">
    <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24">
      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
    </svg>
  </a>

  <!-- ==========================================
       LIGHTBOX (ПРОСМОТР, ЗУМ, СКАЧИВАНИЕ ФОТО)
       ========================================== -->
  <div id="image-lightbox" class="lightbox-modal">
    <div class="lightbox-header">
      <div id="lb-title" class="lightbox-title">Название товара</div>
      <div class="lightbox-actions">
        <!-- Приблизить -->
        <button id="lb-zoom-in" class="lb-btn" title="Приблизить (+)">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <!-- Отдалить -->
        <button id="lb-zoom-out" class="lb-btn" title="Отдалить (-)">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <!-- Сброс зума -->
        <button id="lb-zoom-reset" class="lb-btn" title="Сбросить масштаб (100%)">100%</button>
        <!-- Скачать фото -->
        <button id="lb-download" class="lb-btn lb-btn-primary" title="Скачать фото">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/></svg>
          <span>Скачать</span>
        </button>
        <!-- Закрыть -->
        <button id="lb-close" class="lb-btn lb-btn-close" title="Закрыть (Esc)">
          ✕
        </button>
      </div>
    </div>

    <div id="lb-viewport" class="lightbox-viewport">
      <img id="lb-img" class="lightbox-img" src="" alt="Фотография">
    </div>

    <div class="lightbox-hint">Колёсико мыши — приближение/отдаление • Перетаскивание для смещения</div>
  </div>

  <!-- Логика сайта -->
  <script>
    const WA_PHONE = '77058202949';
    let allProducts = [];
    let currentFilter = 'all';

    // Парсер названий файлов формата: Пуговицы_300_M_A.jpg
    function parseFilename(file) {
      const dotIndex = file.lastIndexOf('.');
      if (dotIndex === -1) return null;
      const baseName = file.substring(0, dotIndex);
      const upper = baseName.toUpperCase();

      // Исключаем системные фото
      if (upper.startsWith('LOGO') || upper.startsWith('ORIENTIR')) {
        return null;
      }

      const parts = baseName.split('_');
      if (parts.length < 4) {
        return {
          filename: file,
          name: baseName.replace(/_/g, ' '),
          price: 0,
          unitText: 'за 1 шт.',
          isAvailable: true,
          statusText: 'Доступно к продаже'
        };
      }

      const statusChar = parts[parts.length - 1].trim().toUpperCase();
      const unitChar = parts[parts.length - 2].trim().toUpperCase();
      const priceRaw = parts[parts.length - 3].trim().replace(/\D/g, '');
      const nameRaw = parts.slice(0, parts.length - 3).join(' ').trim().replace(/_/g, ' ');

      let unitText = 'за 1 шт.';
      if (unitChar === 'M' || unitChar === 'М') {
        unitText = 'за 1 метр';
      } else if (unitChar === 'SH' || unitChar === 'Ш' || unitChar === 'ШТ') {
        unitText = 'за 1 шт.';
      }

      const isAvailable = (statusChar === 'A' || statusChar === 'А');
      const statusText = isAvailable ? 'Доступно к продаже' : 'В данный момент нет в продаже';

      return {
        filename: file,
        name: nameRaw,
        price: parseInt(priceRaw, 10) || 0,
        unitText: unitText,
        isAvailable: isAvailable,
        statusText: statusText
      };
    }

    // Инициализация фото шапки (LOGO) и ориентира (ORIENTIR)
    function setupSpecialImages(files) {
      const logoEl = document.getElementById('logo-img');
      const orientirEl = document.getElementById('orientir-photo');

      const logoFile = files.find(f => {
        const u = f.toUpperCase();
        return u.startsWith('LOGO.') || u.startsWith('LOGO_');
      });

      const orientirFile = files.find(f => {
        const u = f.toUpperCase();
        return u.startsWith('ORIENTIR.') || u.startsWith('ORIENTIR_');
      });

      if (logoFile) {
        logoEl.src = `images/${logoFile}`;
        logoEl.style.display = 'block';
        document.getElementById('brand-fallback-text').style.display = 'none';
      }

      if (orientirFile) {
        orientirEl.src = `images/${orientirFile}`;
        orientirEl.style.display = 'block';
        orientirEl.addEventListener('click', () => {
          openLightbox(`images/${orientirFile}`, 'Ориентир ателье', orientirFile);
        });
      }
    }

    // Отрисовка каталога
    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      let filtered = allProducts.filter(item => {
        const matchesQuery = item.name.toLowerCase().includes(query);
        if (!matchesQuery) return false;

        if (currentFilter === 'available') return item.isAvailable;
        if (currentFilter === 'unavailable') return !item.isAvailable;
        return true;
      });

      // Сортировка: сначала доступные
      filtered.sort((a, b) => {
        if (a.isAvailable && !b.isAvailable) return -1;
        if (!a.isAvailable && b.isAvailable) return 1;
        return a.name.localeCompare(b.name, 'ru');
      });

      document.getElementById('counter').innerText = `Найдено: ${filtered.length} шт.`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h4>Ничего не найдено</h4>
            <p>Попробуйте изменить запрос или сбросить фильтры.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const waMsg = encodeURIComponent(`Здравствуйте! Интересует товар: "${item.name}" по цене ${item.price} ₸ (${item.unitText}). Есть ли в наличии?`);
        const safeFilename = encodeURIComponent(item.filename);
        const safeName = item.name.replace(/"/g, '&quot;');

        return `
          <div class="product-card ${item.isAvailable ? '' : 'unavailable'}" data-file="${safeFilename}" data-name="${safeName}">
            <div class="card-img-wrap" onclick="openLightbox('images/${safeFilename}', '${safeName}', '${safeFilename}')">
              <span class="status-badge ${item.isAvailable ? 'status-available' : 'status-unavailable'}">
                ${item.isAvailable ? '✓ ' + item.statusText : '✕ ' + item.statusText}
              </span>
              <img src="images/${safeFilename}" alt="${item.name}" loading="lazy">
            </div>
            <div class="card-body">
              <div class="product-title">${item.name}</div>
              <div class="price-block">
                <span class="price-value">${item.price.toLocaleString('ru-RU')} ₸</span>
                <span class="price-unit">${item.unitText}</span>
              </div>
              <a href="https://wa.me/${WA_PHONE}?text=${waMsg}" target="_blank" class="order-btn">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                ${item.isAvailable ? 'Заказать в WhatsApp' : 'Уточнить в WhatsApp'}
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Загрузка каталога
    async function loadCatalog() {
      try {
        const response = await fetch('catalog.json');
        if (!response.ok) throw new Error('catalog.json не найден');
        const files = await response.json();

        setupSpecialImages(files);

        allProducts = files
          .map(parseFilename)
          .filter(Boolean);

        renderCatalog();
      } catch (err) {
        console.warn('Загрузка из catalog.json не удалась, показ демонстрационного примера:', err);
        const demoFiles = [
          "Пуговицы-перламутровые_300_SH_A.jpg",
          "Кружево-хлопок_500_M_A.jpg",
          "Нитки-армированные_150_SH_N.jpg"
        ];
        allProducts = demoFiles.map(parseFilename).filter(Boolean);
        renderCatalog();
      }
    }

    // ==========================================
    // ЛОГИКА LIGHTBOX (ПРОСМОТР, МАСШТАБ, СКАЧИВАНИЕ)
    // ==========================================
    const lbModal = document.getElementById('image-lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbTitle = document.getElementById('lb-title');
    const lbViewport = document.getElementById('lb-viewport');
    const lbDownloadBtn = document.getElementById('lb-download');

    let currentZoom = 1;
    let posX = 0;
    let posY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentImageSrc = '';
    let currentImageFilename = '';

    function updateTransform() {
      lbImg.style.transform = `translate(${posX}px, ${posY}px) scale(${currentZoom})`;
      document.getElementById('lb-zoom-reset').innerText = `${Math.round(currentZoom * 100)}%`;
    }

    function resetZoom() {
      currentZoom = 1;
      posX = 0;
      posY = 0;
      updateTransform();
    }

    function setZoom(newZoom) {
      currentZoom = Math.min(Math.max(newZoom, 1), 4);
      if (currentZoom === 1) {
        posX = 0;
        posY = 0;
      }
      updateTransform();
    }

    function openLightbox(src, title, filename) {
      currentImageSrc = src;
      currentImageFilename = decodeURIComponent(filename || 'image.jpg');

      lbImg.src = src;
      lbTitle.innerText = title;
      resetZoom();

      lbModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lbModal.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => {
        lbImg.src = '';
      }, 200);
    }

    // Скачивание файла
    lbDownloadBtn.addEventListener('click', async () => {
      try {
        const response = await fetch(currentImageSrc);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = currentImageFilename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        // Запасной вариант скачивания
        const a = document.createElement('a');
        a.href = currentImageSrc;
        a.download = currentImageFilename;
        a.target = '_blank';
        a.click();
      }
    });

    // Кнопки зума
    document.getElementById('lb-zoom-in').addEventListener('click', () => setZoom(currentZoom + 0.35));
    document.getElementById('lb-zoom-out').addEventListener('click', () => setZoom(currentZoom - 0.35));
    document.getElementById('lb-zoom-reset').addEventListener('click', resetZoom);
    document.getElementById('lb-close').addEventListener('click', closeLightbox);

    // Двойной клик для быстрого зума
    lbImg.addEventListener('dblclick', () => {
      if (currentZoom > 1) {
        resetZoom();
      } else {
        setZoom(2.2);
      }
    });

    // Зум колёсиком мыши
    lbViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.25 : -0.25;
      setZoom(currentZoom + delta);
    }, { passive: false });

    // Перетаскивание мышью / пальцем при приближении
    function startDrag(clientX, clientY) {
      if (currentZoom <= 1) return;
      isDragging = true;
      startX = clientX - posX;
      startY = clientY - posY;
      lbViewport.classList.add('grabbing');
    }

    function moveDrag(clientX, clientY) {
      if (!isDragging) return;
      posX = clientX - startX;
      posY = clientY - startY;
      updateTransform();
    }

    function stopDrag() {
      isDragging = false;
      lbViewport.classList.remove('grabbing');
    }

    // Мышь
    lbViewport.addEventListener('mousedown', (e) => {
      if (e.target === lbViewport && currentZoom === 1) {
        closeLightbox();
        return;
      }
      startDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', stopDrag);

    // Сенсорные экраны (смартфоны)
    lbViewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    lbViewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    lbViewport.addEventListener('touchend', stopDrag);

    // Закрытие по клавише Esc
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
      }
    });

    // Обработчики фильтров и поиска
    document.getElementById('search-input').addEventListener('input', renderCatalog);

    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderCatalog();
      });
    });

    // Модальное окно "Как нас найти"
    const modal = document.getElementById('orientir-modal');
    document.getElementById('open-orientir-btn').addEventListener('click', () => modal.classList.add('active'));
    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    // Запуск
    loadCatalog();
  </script>
</body>
